
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>ICT Club Checker</title>

    <style>
        body {
            background-image: url('https://i.pinimg.com/736x/f6/89/77/f689774c7eaed97ad904c7a9232a5f7c.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-color: #344b2c;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0 30px 30px;
        }

        .navbar {
            background-color: #0d180cbd;
            padding: 15px 5%;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            margin: 0 -30px;
        }

        .rohansportfolio {
            color: #e8eee2 !important;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .navbar .nav-link {
            color: #dce8d4;
            margin: 0 7px;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #a9ce91;
        }

        h1 {
            text-align: center;
            color: #344b2c;
            font-size: 35px;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #344b2c;
            font-size: 35px;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        h3 {
            text-align: center;
            color: #617653;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .container {
            background-image: url('https://i.pinimg.com/736x/f6/89/77/f689774c7eaed97ad904c7a9232a5f7c.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            box-sizing: border-box;
            margin: auto;
            padding: 35px;
            border: 2px solid #8ba17b;
            border-radius: 15px;
            box-shadow: 0px 5px 12px #344b2c25;
        }

        .form {
            background-image: url('https://i.pinimg.com/736x/f6/89/77/f689774c7eaed97ad904c7a9232a5f7c.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            padding: 20px;
            border-radius: 10px;
        }

        .input-group {
            margin: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #344b2c;
            font-size: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #9aaa8e;
            background-color: white;
            color: #344b2c;
            font-size: 16px;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        input:focus {
            outline: none;
            border: 2px solid #617f50;
        }

        button {
            display: block;
            margin: 25px auto 10px;
            padding: 13px 35px;
            border-radius: 8px;
            border: none;
            background-color: #526d43;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #3e5633;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e4ebdd;
            border-left: 5px solid #617f50;
            border-radius: 8px;
            min-height: 100px;
        }

        #message {
            text-align: center;
            color: #344b2c;
            font-size: 18px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {

            body {
                padding: 0 15px 15px;
            }

            .navbar {
                margin: 0 -15px;
            }

            h1 {
                font-size: 28px;
            }

            .container {
                padding: 18px;
            }

            .form {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">

        <div class="container-fluid">

            <a class="rohansportfolio" href="project.html">
                Rohan's Portfolio
            </a>

            <div class="collapse navbar-collapse" id="portfolioNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="project.html">
                            Meet the Creator
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="Seatwork1.html">
                            Nickname Atlas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="skillstest.html">
                            Weather Instrument Checker

                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="drill2.html">
                            School Club Members
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <h1>⋆˙⟡ BOOK CLUB CHECKER ⊹ ࣪ ˖</h1>

    <h2> · · ─ ·ʚɞ· ─ · ·</h2>

    <h3>Candidate Verification System</h3>

    <div class="container">

        <div class="form">

            <div class="input-group">

                <label for="firstname">First Name:</label>

                <input
                    type="text"
                    id="firstname"
                    placeholder="⁀➴ Enter your first name"
                >

            </div>

            <div class="input-group">

                <label for="lastname">Last Name:</label>

                <input
                    type="text"
                    id="lastname"
                    placeholder="⁀➴ Enter your last name"
                >

            </div>

        </div>

        <button py-click="check_candidate">
            Check Membership
        </button>

        <div class="result">

            <h2>❀°Verification Result°❀</h2>

            <p id="message">
                𓏲﹕Enter your name above to check your membership﹕⸝⸝
            </p>

        </div>

    </div>

    <script type="py" src="Seatwork1.py"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
