
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Student Club Members</title>

    <style>
        body {
            background-color: #e8eee2;
            font-family: 'Trebuchet MS', Arial, sans-serif;
            margin: 0;
            padding: 0 30px 30px;
        }

        .navbar {
            background-color: #0d180cbd;
            padding: 15px 5%;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            margin: 0 -30px;
        }

        .rohansportfolio {
            color: #e8eee2 !important;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .navbar .nav-link {
            color: #dce8d4;
            margin: 0 7px;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #a9ce91;
        }

        h1 {
            text-align: center;
            color: #344b2c;
            font-size: 35px;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        h3 {
            text-align: center;
            color: #617653;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .container {
            background-color: #f8faf5;
            width: 100%;
            box-sizing: border-box;
            margin: auto;
            padding: 35px;
            border: 2px solid #8ba17b;
            border-radius: 15px;
            box-shadow: 0px 5px 12px #344b2c25;
        }

        .form {
            background-color: #e4ebdd;
            padding: 20px;
            border-radius: 10px;
        }

        .input-group {
            margin: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #344b2c;
            font-size: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #9aaa8e;
            background-color: white;
            color: #344b2c;
            font-size: 16px;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        input:focus {
            outline: none;
            border: 2px solid #617f50;
        }

        button {
            display: block;
            margin: 25px auto 10px;
            padding: 13px 35px;
            border-radius: 8px;
            border: none;
            background-color: #526d43;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #3e5633;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e4ebdd;
            border-left: 5px solid #617f50;
            border-radius: 8px;
            min-height: 100px;
            overflow-wrap: anywhere;
        }

        .result h2 {
            text-align: center;
            color: #344b2c;
            margin-top: 5px;
        }

        #members {
            color: #344b2c;
            font-size: 17px;
            line-height: 1.8;
        }

        #total {
            text-align: center;
            color: #526d43;
            font-size: 20px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #617653;
            font-size: 14px;
        }


    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">

        <div class="container-fluid">

            <a class="rohansportfolio" href="project.html">
                Rohan's Portfolio
            </a>

            <div class="collapse navbar-collapse" id="portfolioNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="project.html">
                            Meet the Creator
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="Seatwork1.html">
                            Nickname Atlas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="skillstest.html">
                            Weather Instrument Checker
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="drill2.html">
                            School Club Members
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <h1>STUDENT CLUB MEMBERS</h1>
    <h3>Manage Club Members</h3>

    <div class="container">

        <div class="form">

            <div class="input-group">
                <label for="firstname">First Name:</label>

                <input
                    type="text"
                    id="firstname"
                    placeholder="Enter first name"
                >
            </div>

            <div class="input-group">
                <label for="lastname">Last Name:</label>

                <input
                    type="text"
                    id="lastname"
                    placeholder="Enter last name"
                >
            </div>

        </div>

        <button py-click="add_member">
            ADD NEW MEMBER
        </button>

        <div class="result">

            <h2>All Club Members</h2>

            <p id="members">
                The member list will appear here after you add a member.
            </p>

            <p id="total">
                Total Members: 8
            </p>

        </div>

    </div>

    <div class="footer">
        ICT Club · Drill 2 · 2nd Quarter
    </div>

    <script type="py" src="drill2.py"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
